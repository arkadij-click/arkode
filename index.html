<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Авторская письменность</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="titles">
      <h1>Авторская письменность</h1>
      <p class="sub">Первый знак — внизу справа, следующие левее, новая строка — выше. Это наборщик знаков, не переводчик.</p>
    </div>
    <div class="status" id="saveStatus" aria-live="polite"></div>
    <button type="button" class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="toolbar" aria-label="Меню">⋯</button>
  </header>

  <section class="toolbar" id="toolbar" aria-label="Документ">
    <button type="button" class="desk-only" data-action="undo" title="Ctrl+Z">↶ Отменить</button>
    <button type="button" class="desk-only" data-action="redo" title="Ctrl+Y / Ctrl+Shift+Z">↷ Вернуть</button>
    <span class="sep desk-only"></span>
    <button type="button" data-action="clear">Очистить</button>
    <button type="button" data-action="open">Открыть JSON…</button>
    <button type="button" data-action="save">Сохранить JSON</button>
    <button type="button" data-action="png">PNG</button>
    <button type="button" data-action="svg">SVG</button>
    <input type="file" id="fileInput" accept=".json,application/json" hidden>
    <span class="sep"></span>
    <label class="opt">Размер <input type="range" id="sizeInput" min="28" max="120" step="2" value="56"></label>
    <label class="opt">Графика <select id="faceInput"><option value="font">прорисовка</option><option value="photo">фото A16</option></select></label>
    <label class="opt"><input type="checkbox" id="framesInput"> Рамки</label>
  </section>

  <div class="workspace">
    <div class="pane-text">
      <div class="editor" id="editorScroll" tabindex="0" aria-label="Текст. Стрелки двигают курсор, Backspace удаляет, Enter — новая строка вверх, пробел — пробел.">
        <canvas id="canvas"></canvas>
      </div>
      <div class="messages" id="messages" aria-live="polite"></div>
    </div>

    <div class="pane-keys">
      <section class="controls" aria-label="Служебные клавиши">
        <button type="button" class="ctl ctl-space" data-action="space">Пробел</button>
        <button type="button" class="ctl" data-action="linebreak" aria-label="Новая строка">↥<span class="lbl"> Новая строка</span></button>
        <button type="button" class="ctl" data-action="backspace" aria-label="Удалить">⌫<span class="lbl"> Удалить</span></button>
        <button type="button" class="ctl touch-only" data-action="undo" aria-label="Отменить">↶</button>
        <button type="button" class="ctl touch-only" data-action="redo" aria-label="Вернуть">↷</button>
        <span class="hint">Курсор: щелчок по тексту или стрелки. ← идёт дальше по тексту, → назад.</span>
      </section>

      <div class="info" id="info"><span class="muted">Наведите или нажмите на знак, чтобы увидеть его описание.</span></div>

      <nav class="tabs" id="tabs" role="tablist" aria-label="Группы знаков"></nav>
      <section id="keyboard" class="keyboard" aria-label="Знаки"></section>
    </div>
  </div>

  <footer class="foot" id="foot"></footer>
</main>
<script src="glyphs.js"></script>
<script src="app.js"></script>
</body>
</html>
