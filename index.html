<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Авторская письменность</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="titles">
      <h1>Авторская письменность</h1>
      <p class="sub">Первый знак — внизу справа, следующие левее, новая строка — выше. Это наборщик знаков, не переводчик.</p>
    </div>
    <div class="status" id="saveStatus" aria-live="polite"></div>
    <button type="button" class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="toolbar" aria-label="Меню">⋯</button>
  </header>

  <section class="toolbar" id="toolbar" aria-label="Документ">
    <button type="button" class="icon-btn desk-only" data-action="undo" title="Отменить (Ctrl+Z)" aria-label="Отменить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button type="button" class="icon-btn desk-only" data-action="redo" title="Вернуть (Ctrl+Y)" aria-label="Вернуть"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <span class="sep desk-only"></span>
    <button type="button" class="icon-btn" data-action="open" title="Открыть JSON" aria-label="Открыть JSON"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1"/><path d="M3 7v11a2 2 0 0 0 2 2h12.5a2 2 0 0 0 1.9-1.4L22 12H7.5a2 2 0 0 0-1.9 1.4L3 20"/></svg></button>
    <button type="button" class="icon-btn" data-action="save" title="Сохранить JSON" aria-label="Сохранить JSON"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8V3"/><rect x="7" y="13" width="10" height="8" rx="1"/></svg></button>
    <button type="button" class="icon-btn" data-action="png" title="Картинка PNG" aria-label="Скачать PNG"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></button>
    <button type="button" class="icon-btn" data-action="svg" title="Вектор SVG" aria-label="Скачать SVG"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 13l7 8 7-8z"/><circle cx="12" cy="13" r="2"/><path d="M12 3v8"/></svg></button>
    <button type="button" class="icon-btn" data-action="clear" title="Очистить (отменяется)" aria-label="Очистить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V4h6v3"/></svg></button>
    <input type="file" id="fileInput" accept=".json,application/json" hidden>
    <span class="sep"></span>
    <label class="opt" title="Размер знаков"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 9 6l5 14M5.8 15h6.4"/><path d="M15 20l3-8 3 8M15.9 17.5h4.2"/></svg><input type="range" id="sizeInput" min="28" max="120" step="2" value="56" aria-label="Размер знаков"></label>
    <label class="opt" title="Графика знаков"><select id="faceInput" aria-label="Графика знаков"><option value="font">шрифт</option><option value="photo">фото</option></select></label>
  </section>

  <div class="workspace">
    <div class="pane-text">
      <div class="editor" id="editorScroll" tabindex="0" aria-label="Текст. Стрелки двигают курсор, Backspace удаляет, Enter — новая строка вверх, пробел — пробел.">
        <canvas id="canvas"></canvas>
      </div>
      <div class="messages" id="messages" aria-live="polite"></div>
    </div>

    <div class="pane-keys">
      <section class="controls" aria-label="Служебные клавиши">
        <button type="button" class="ctl ctl-space" data-action="space">Пробел</button>
        <button type="button" class="ctl" data-action="linebreak" aria-label="Новая строка">↥<span class="lbl"> Новая строка</span></button>
        <button type="button" class="ctl" data-action="backspace" aria-label="Удалить">⌦<span class="lbl"> Удалить</span></button>
        <button type="button" class="ctl touch-only" data-action="undo" aria-label="Отменить">↶</button>
        <button type="button" class="ctl touch-only" data-action="redo" aria-label="Вернуть">↷</button>
        <span class="hint">Курсор: щелчок по тексту или стрелки. ← идёт дальше по тексту, → назад.</span>
      </section>

      <div class="info" id="info"><span class="muted">Наведите или нажмите на знак, чтобы увидеть его описание.</span></div>

      <section id="keyboard" class="keyboard" aria-label="Знаки"></section>
    </div>
  </div>

  <footer class="foot" id="foot"></footer>
</main>
<script src="glyphs.js"></script>
<script src="app.js"></script>
</body>
</html>
